name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff lint
      run: ruff check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Auth Service Dependencies
        working-directory: ./auth-service
        run: pip install -r requirements.txt
      
      - name: Run Auth Service Tests
        working-directory: ./auth-service
        env:
          AUTH_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
          SECRET_KEY: test_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: pytest
      
      - name: Install Task Service Dependencies
        working-directory: ./task-service
        run: pip install -r requirements.txt 
      
      - name: Run Task Service Tests
        working-directory: ./task-service
        env:
          TASK_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
          SECRET_KEY: test_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: false
          tags: auth-service:latest
      
      - name: Build Task Service image
        uses: docker/build-push-action@v5
        with:
          context: ./task-service
          push: false
          tags: task-service:latest

      - name: Build Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: false
          tags: gateway:latest