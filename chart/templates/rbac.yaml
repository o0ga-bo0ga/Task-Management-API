apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Values.taskService.name}}
  namespace: {{.Values.namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{.Values.taskService.name}}-role
  namespace: {{.Values.namespace}}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{.Values.taskService.name}}-rolebinding
  namespace: {{.Values.namespace}}
subjects:
- kind: ServiceAccount
  name: {{.Values.taskService.name}}
  namespace: {{.Values.namespace}}
roleRef:
  kind: Role
  name: {{.Values.taskService.name}}-role
  apiGroup: rbac.authorization.k8s.io