apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: task-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-db
  template:
    metadata:
      labels:
        app: task-db
    spec:
      containers:
        - name: {{ .Values.taskDb.image }}
          image: {{ .Values.taskDb.image }}:{{ .Values.taskDb.tag }}
          ports:
            - containerPort: {{ .Values.taskDb.port }}
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: my-secret-base64
                  key: TASK_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-secret-base64
                  key: TASK_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: my-secret-base64
                  key: TASK_POSTGRES_DB
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: task-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: task-db
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.taskDb.port }}
      targetPort: {{ .Values.taskDb.port }}
  selector:
    app: task-db
