apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-platform-ingress
  namespace: {{.Values.namespace}}
spec:
  ingressClassName: nginx
  rules:
    - host: {{.Values.ingress.host}}
      http:
        paths:
         - path: /
           pathType: Prefix
           backend:
             service:
               name: {{.Values.gateway.name}}
               port:
                 number: {{.Values.gateway.port}}